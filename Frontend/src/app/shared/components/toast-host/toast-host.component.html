@if (toastService.message()) {
<div class="toast mt-12 mr-3 show align-items-center border-0 shadow-lg text-bg-dark position-fixed top-0 inset-e-0 z-9999"
  role="alert" aria-live="polite" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body">{{ toastService.message() }}</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
      (click)="toastService.clear()"></button>
  </div>
</div>
}
